<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Stability Management System</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#15232b"><link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f4f6f7;--ink:#15232b;--mut:#5d6b73;--card:#fff;--line:#dbe2e6;--pri:#1f5fae;--side:#15232b;
--g:#4caf50;--y:#f2c230;--o:#f08a24;--r:#e53935;--dr:#8e0f1b;--dg:#1b5e20}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
#app{display:flex;min-height:100vh}nav{width:220px;background:var(--side);color:#cfdbe1;padding:14px 0;flex-shrink:0}
nav h1{font-size:15px;margin:0 16px 12px;color:#fff}nav a{display:block;padding:10px 16px;color:inherit;text-decoration:none;cursor:pointer;border-inline-start:3px solid transparent}
nav a.on{background:#1f3540;color:#fff;border-color:#2f80ed}main{flex:1;padding:18px;min-width:0}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
h2{margin:0;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;border-inline-start:6px solid var(--c)}.kpi b{font-size:24px;display:block}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:start;font-size:14px;vertical-align:top}th{background:#eef2f4;position:sticky;top:0}
.tw{overflow-x:auto}button,.btn{font:inherit;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:6px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.d{color:var(--r)}button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;color:#fff;font-size:12px;white-space:nowrap}.tag.y,.tag.l{color:#222}
.c-g{background:var(--g)}.c-y{background:var(--y)}.c-o{background:var(--o)}.c-r{background:var(--r)}.c-dr{background:var(--dr)}.c-dg{background:var(--dg)}
.mod{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.mod>div{background:#fff;border-radius:8px;padding:16px;width:min(760px,100%)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.warn{background:#fff4e5;border:1px solid #f0c27a;padding:8px;border-radius:6px;margin:8px 0}.bad{color:var(--r)}.ok{color:var(--dg)}
#login{max-width:380px;margin:8vh auto;padding:16px}.muted{color:var(--mut);font-size:13px}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:0}nav h1{display:none}nav a{white-space:nowrap;border-inline-start:0;border-bottom:3px solid transparent}nav a.on{border-color:#2f80ed}}
@media print{nav,.top button,.noprint{display:none!important}main{padding:0}}
</style></head><body><div id="root"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addM=(s,m)=>{const d=pd(s),x=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()!==x)d.setDate(0);return iso(d)};
const today=()=>iso(new Date()),diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ---------- i18n ---------- */
let LANG=localStorage.getItem('sms_lang')||'ar';
const T={dashboard:['لوحة التحكم','Dashboard'],products:['المنتجات','Products'],studies:['دراسات الثبات','Stability Studies'],schedule:['جدول العينات','Sample Schedule'],results:['النتائج','Results'],reports:['التقارير','Reports'],users:['المستخدمون والصلاحيات','Users & Permissions'],audit:['سجل العمليات','Audit Trail'],settings:['الإعدادات','Settings'],logout:['خروج','Logout'],add:['إضافة','Add'],save:['حفظ','Save'],cancel:['إلغاء','Cancel'],edit:['تعديل','Edit'],none:['لا توجد بيانات','No data'],conditions:['ظروف التخزين','Storage Conditions'],protocols:['البروتوكولات','Protocols']};
const t=k=>(T[k]||[k,k])[LANG==='ar'?0:1];
/* ---------- constants ---------- */
const FIELDS=[['product','Product Name / Concentration'],['form','Dosage Form'],['pack','Volume / Pack'],['batch','Batch Number'],['api','Active Ingredient'],['holder','License Holder'],['mfr','Manufacturer'],['reason','Study Reason'],['mfgDate','Manufacturing Date','date'],['expDate','Expiry Date','date'],['startDate','Incubation / Study Start Date','date'],['protocol','Study Protocol'],['notes','Notes']];
const REQ=['product','batch','startDate','protocol'];
const ROLES=['Admin','R&D','QC','QA','Viewer','Pending'];
const STATES=['Scheduled','Due','Overdue','Sampled','Under Testing','Reviewed','Approved'];
const CAN={study:['Admin','R&D'],sample:['Admin','QC'],review:['Admin','QA'],users:['Admin'],del:['Admin']};
/* ---------- data layer ---------- */
const D={products:[],conditions:[],protocols:[],studies:[],samples:[],settings:[],audit:[],users:[]},COLS=Object.keys(D);let SMAP={};let ME=null,FB=null,settings=JSON.parse(localStorage.getItem('sms_set')||'{"y":7,"o":3,"notify":true}');
const LS=JSON.parse(localStorage.getItem('sms_data')||'{}');
function persist(){localStorage.setItem('sms_data',JSON.stringify(LS))}
async function dbSet(col,id,obj){
  if(FB){await FB.db.collection(col).doc(id).set(obj)}else{(LS[col]=LS[col]||{})[id]=obj;persist();D[col]=Object.values(LS[col])}
}
async function dbDel(col,id){if(FB){await FB.db.collection(col).doc(id).delete()}else{delete LS[col][id];persist();D[col]=Object.values(LS[col])}}
function mkAudit(action,entity,entityId,o,n){return{id:uid(),ts:FB?firebase.firestore.FieldValue.serverTimestamp():new Date().toISOString(),uid:ME.id,user:ME.name+' ('+ME.role+')',action,entity,entityId,old:o==null?'':JSON.stringify(o),new:n==null?'':JSON.stringify(n)}}
async function audit(...a){const e=mkAudit(...a);await dbSet('audit',e.id,e)}
async function commit(ops){if(FB){const b=FB.db.batch();ops.forEach(([c,i,o])=>b.set(FB.db.collection(c).doc(i),o));await b.commit()}else for(const[c,i,o] of ops)await dbSet(c,i,o)}
const fix=o=>{if(o.ts&&o.ts.toDate)o={...o,ts:o.ts.toDate().toISOString()};if(o.sig&&o.sig.ts&&o.sig.ts.toDate)o={...o,sig:{...o.sig,ts:o.sig.ts.toDate().toISOString()}};return o};
const can=a=>ME&&CAN[a].includes(ME.role);
async function initBackend(){
  const cfg=window.FIREBASE_CONFIG;
  if(cfg){
    for(const u of ['app','auth','firestore'])await new Promise((ok,no)=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/10.12.2/firebase-${u}-compat.js`;s.onload=ok;s.onerror=()=>no(new Error('Firebase load failed'));document.head.appendChild(s)});
    firebase.initializeApp(cfg);const db=firebase.firestore();
    try{await db.enablePersistence({synchronizeTabs:true})}catch(e){console.warn(e)}
    FB={db,auth:firebase.auth()};
  }else COLS.forEach(c=>D[c]=Object.values(LS[c]||{}));
}
function listen(){
  if(!FB)return;
  COLS.forEach(c=>FB.db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>fix(d.data({serverTimestamps:'estimate'})));const was=ME;if(c==='users'&&ME){const m=D.users.find(x=>x.id===ME.id);if(m){if(m.disabled){ME=null;FB.auth.signOut();alert('تم تعطيل حسابك')}else ME=m}}if(was)draw()}));
}
/* ---------- auth ---------- */
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function signup(name,email,pass){
  if(FB){const c=await FB.auth.createUserWithEmailAndPassword(email,pass);
    const u={id:c.user.uid,name,email,role:'Pending'};await dbSet('users',u.id,u);ME=u;await audit('signup','user',u.id,null,{name,email,role:u.role});return}
  if(D.users.some(u=>u.email===email))throw new Error('الإيميل مسجل');
  const u={id:uid(),name,email,pass:await hash(pass),role:D.users.length?'Pending':'Admin'};await dbSet('users',u.id,u);ME=u;sessionStorage.setItem('sms_me',u.id);await audit('signup','user',u.id,null,{name,email,role:u.role});
}
async function login(email,pass){
  if(FB){const c=await FB.auth.signInWithEmailAndPassword(email,pass);await new Promise(r=>setTimeout(r,800));const g=await FB.db.collection('users').doc(c.user.uid).get();ME=g.exists?g.data():null;if(!ME){ME={id:c.user.uid,name:email.split('@')[0],email,role:'Pending'};await dbSet('users',ME.id,ME);await audit('signup','user',ME.id,null,{email,role:'Pending'})}if(ME.disabled){await FB.auth.signOut();ME=null;throw new Error('الحساب معطّل. تواصل مع الـ Admin')}return}
  const h=await hash(pass),u=D.users.find(u=>u.email===email&&u.pass===h);if(!u)throw new Error('بيانات الدخول غير صحيحة');if(u.disabled)throw new Error('الحساب معطّل');ME=u;sessionStorage.setItem('sms_me',u.id);
}
window.chkActive=async()=>{try{const g=FB?(await FB.db.collection('users').doc(ME.id).get()).data():D.users.find(u=>u.id===ME.id);if(g&&g.role!=='Pending'){location.reload()}else alert('لسه بانتظار التفعيل')}catch(e){alert('تعذر التحديث: '+e.message)}};
async function logout(){if(FB)await FB.auth.signOut();sessionStorage.removeItem('sms_me');ME=null;draw()}
/* ---------- schedule engine ---------- */
function parsePoints(s){const a=String(s||'').split(/[,،;\s]+/).map(x=>x.replace(/m$/i,'').trim()).filter(Boolean).map(Number);return a.length&&a.every(n=>n>=0&&isFinite(n))?[...new Set(a)].sort((x,y)=>x-y):null}
function rowsOf(st){
  if(!st.startDate||!st.points)return[];
  return st.points.map(m=>({st,m,due:addM(st.startDate,m),rec:SMAP[st.id+'_'+m]||{}}));
}
function stat(r){
  const s=r.rec.state;if(s&&['Sampled','Under Testing','Reviewed','Approved'].includes(s))return{state:s,cls:'c-dg',days:null};
  if(r.st.status==='Suspended')return{state:'Suspended (study)',cls:'c-g',days:null};const d=diff(r.due,today());
  if(d<0)return{state:'Overdue',cls:'c-dr',days:d};if(d===0)return{state:'Due',cls:'c-r',days:0};
  if(d<=settings.o)return{state:'Scheduled',cls:'c-o',days:d};if(d<=settings.y)return{state:'Scheduled',cls:'c-y',days:d};return{state:'Scheduled',cls:'c-g',days:d};
}
const allRows=()=>D.studies.filter(s=>!s.archived).flatMap(rowsOf).map(r=>({...r,s:stat(r)}));
const tag=(r)=>`<span class="tag ${r.s.cls} ${r.s.cls==='c-y'?'y':''}">${r.s.state}${r.s.days!=null&&r.s.state==='Scheduled'?' · '+r.s.days+'d':''}${r.s.state==='Overdue'?' · '+(-r.s.days)+'d':''}</span>`;
function notifyCheck(){
  if(!settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const sent=JSON.parse(localStorage.getItem('sms_sent')||'{}');
  for(const r of allRows()){if(r.s.cls==='c-g'||r.s.cls==='c-dg')continue;const stage=r.s.cls,k=r.st.id+'|'+r.m+'|'+stage+(stage==='c-dr'?'|'+today():'');
    if(sent[k])continue;sent[k]=1;new Notification('Stability: '+r.st.product+' / '+r.st.batch,{body:`${r.m}M — ${r.due} — ${r.s.state}`,tag:k})}
  localStorage.setItem('sms_sent',JSON.stringify(sent));
}
/* ---------- UI helpers ---------- */
let VIEW='dashboard',FILTER='';
const nav=['dashboard','products','conditions','protocols','studies','schedule','results','reports','users','audit','settings'];
function modal(html){const m=document.createElement('div');m.className='mod';m.innerHTML='<div>'+html+'</div>';m.addEventListener('mousedown',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
const val=(m,n)=>m.querySelector('[name='+n+']').value.trim();
function table(h,rows){return rows.length?`<div class="tw"><table><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')}</table></div>`:`<p class="muted">${t('none')}</p>`}
function fieldHtml([k,l,ty],v){return `<div><label>${l}${REQ.includes(k)?' *':''}</label>${k==='notes'||k==='protocol'?`<textarea name="${k}" rows="2">${esc(v)}</textarea>`:`<input name="${k}" type="${ty||'text'}" value="${esc(v)}">`}</div>`}
/* ---------- views ---------- */
const V={};
let SFILTER='';
const PRED={overdue:r=>r.s.state==='Overdue',due:r=>r.s.state==='Due',d7:r=>r.s.days!=null&&r.s.days>=0&&r.s.days<=7,d30:r=>r.s.days!=null&&r.s.days>=0&&r.s.days<=30,testing:r=>r.s.state==='Under Testing',pending:r=>['Sampled','Under Testing'].includes(r.s.state)&&(!r.rec.conf||r.rec.conf==='Pending'),review:r=>(r.s.state==='Under Testing'&&['Conforms','OOS'].includes(r.rec.conf))||r.s.state==='Reviewed',oos:r=>r.rec.conf==='OOS'};
window.go=(v,f={})=>{VIEW=v;FILTER='';FSTATUS=f.status||'';FTYPE='';FCOND='';FYEAR='';SFILTER=f.s||'';draw();scrollTo(0,0)};
const bars=(items)=>{const mx=Math.max(1,...items.map(i=>i[1]));return items.map(([l,v,c])=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span style="width:104px;font-size:13px;flex-shrink:0">${esc(l)}</span><div style="flex:1;background:#eef2f4;border-radius:4px"><div style="width:${Math.round(v/mx*100)}%;min-width:${v?3:0}px;background:${c||'var(--pri)'};height:18px;border-radius:4px"></div></div><b style="width:30px;text-align:end">${v}</b></div>`).join('')};
V.dashboard=()=>{
  const R=allRows(),S=D.studies.filter(s=>!s.archived),L=(a,e)=>LANG==='ar'?a:e,st=s=>s.status||'Active',n=k=>R.filter(PRED[k]).length;
  const mk=(l,v,col,act)=>`<div class="kpi" style="--c:var(${col});${act?'cursor:pointer':'opacity:.5'}"${act?` onclick="${act}"`:''}><b>${v}</b>${l}</div>`;
  const H=x=>`<h4 style="margin:16px 0 6px;color:var(--mut)">${x}</h4>`,sc=k=>`go('schedule',{s:'${k}'})`;
  const al=R.filter(r=>['c-dr','c-r','c-o','c-y'].includes(r.s.cls)).sort((a,b)=>a.due<b.due?-1:1);
  const now=new Date(),months=[0,1,2,3,4,5].map(i=>iso(new Date(now.getFullYear(),now.getMonth()+i,1)).slice(0,7));
  const open=R.filter(r=>['c-g','c-y','c-o','c-r'].includes(r.s.cls)),types={};S.forEach(s=>{const k=s.studyType||L('غير محدد','n/a');types[k]=(types[k]||0)+1});
  const sc2={Overdue:'var(--dr)',Due:'var(--r)',Scheduled:'var(--g)',Sampled:'var(--dg)','Under Testing':'var(--o)',Reviewed:'#2f80ed',Approved:'var(--dg)'};
  return `<div class="top"><h2>${t('dashboard')}</h2></div>
  ${H(L('الدراسات','Studies'))}<div class="grid">${mk(L('إجمالي الدراسات','Total studies'),S.length,'--pri',"go('studies')")+mk(L('نشطة','Active'),S.filter(s=>st(s)==='Active').length,'--g',"go('studies',{status:'Active'})")+mk(L('موقوفة','Suspended'),S.filter(s=>st(s)==='Suspended').length,'--o',"go('studies',{status:'Suspended'})")+mk(L('منتهية','Closed'),S.filter(s=>st(s)==='Closed').length,'--dg',"go('studies',{status:'Closed'})")+mk(L('دراسات متأخرة','Overdue studies'),new Set(R.filter(PRED.overdue).map(r=>r.st.id)).size,'--dr',sc('overdue'))}</div>
  ${H(L('نقاط السحب والعينات','Sampling & samples'))}<div class="grid">${mk(L('سحب متأخر','Overdue'),n('overdue'),'--dr',sc('overdue'))+mk(L('سحب اليوم','Due today'),n('due'),'--r',sc('due'))+mk(L('خلال 7 أيام','Next 7 days'),n('d7'),'--y',sc('d7'))+mk(L('خلال 30 يوم','Next 30 days'),n('d30'),'--g',sc('d30'))+mk(L('تحت التحليل','Under testing'),n('testing'),'--o',sc('testing'))+mk(L('نتائج Pending','Pending results'),n('pending'),'--y',sc('pending'))+mk(L('تحتاج مراجعة/اعتماد','Need review/approval'),n('review'),'--pri',sc('review'))+mk(L('نتائج OOS','OOS results'),n('oos'),'--dr',sc('oos'))}</div>
  ${H(L('البيانات الأساسية','Master data'))}<div class="grid">${mk(L('بروتوكولات تنتظر الاعتماد','Protocols awaiting approval'),D.protocols.filter(p=>p.status==='Draft').length,'--o',"go('protocols')")+mk(L('منتجات نشطة','Active products'),D.products.filter(p=>p.status!=='Inactive').length,'--pri',"go('products')")+mk(L('ظروف تخزين نشطة','Active conditions'),D.conditions.filter(c=>c.status!=='Inactive').length,'--pri',"go('conditions')")}</div>
  ${H(L('قيد التطوير (مراحل قادمة)','Planned (later phases)'))}<div class="grid">${[['OOT',5],['Investigations',5],['CAPA',5],['Deviations',5],['Chambers available',8],['Chambers out of service',8]].map(([l,p])=>mk(l+' · P'+p,'—','--mut','')).join('')}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
   <div class="card"><b>${L('حالات العينات','Sample states')}</b>${bars(Object.keys(sc2).map(k=>[k,R.filter(r=>r.s.state===k).length,sc2[k]]))}</div>
   <div class="card"><b>${L('سحب قادم لكل شهر','Upcoming per month')}</b>${bars([[L('متأخر','Overdue'),n('overdue'),'var(--dr)'],...months.map(m=>[m,open.filter(r=>r.due.startsWith(m)).length,'var(--pri)'])])}</div>
   <div class="card"><b>${L('الدراسات حسب النوع','Studies by type')}</b>${Object.keys(types).length?bars(Object.entries(types).map(([k,v])=>[k,v])):`<p class="muted">${t('none')}</p>`}</div></div>
  <div class="card"><b>${L('تنبيهات المواعيد','Sampling alerts')}</b> <button onclick="go('schedule')" style="float:inline-end">${L('عرض الكل','View all')}</button>${table(['Study','Product','Batch','Point','Due','Status'],al.slice(0,10).map(r=>[esc(r.st.studyNo||'—'),esc(r.st.product),esc(r.st.batch),r.m+'M',r.due,tag(r)]))}</div>
  ${D.studies.filter(s=>!s.archived&&!s.points).length?`<div class="warn">يوجد ${D.studies.filter(s=>!s.archived&&!s.points).length} دراسة بدون نقاط بروتوكول — لم يتم توليد مواعيد لها.</div>`:''}
  ${'Notification' in window&&Notification.permission!=='granted'?'<button onclick="Notification.requestPermission().then(()=>{notifyCheck();draw()})">تفعيل الإشعارات على هذا الجهاز</button>':''}`;
};

/* ---------- Phase 2: master data ---------- */
const DEF_TYPES=['Long-Term','Accelerated','Intermediate','Ongoing','Commitment','In-Use','Photostability','Raw Material'];
const getTypes=()=>{const l=D.settings.find(x=>x.id==='lists');return l&&l.studyTypes&&l.studyTypes.length?l.studyTypes:DEF_TYPES};
const fSel=(n,l,opts,v)=>`<div><label>${l}</label><select name="${n}"><option value="">—</option>${opts.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}"${String(v??'')===String(a)?' selected':''}>${esc(b)}</option>`}).join('')}</select></div>`;
const fTxt=(n,l,v,ty='text')=>`<div><label>${l}</label><input name="${n}" type="${ty}" value="${esc(v)}"${ty==='number'?' step="any"':''}></div>`;
const fTa=(n,l,v,r=2)=>`<div style="grid-column:1/-1"><label>${l}</label><textarea name="${n}" rows="${r}">${esc(v)}</textarea></div>`;
const prodName=id=>(D.products.find(p=>p.id===id)||{}).product||'';
const condName=id=>(D.conditions.find(c=>c.id===id)||{}).name||'';
const prodLabel=p=>p.product+(p.conc?' '+p.conc:'')+(p.pack?' / '+p.pack:'');

    rows.forEach((r,i)=>{const o={id:uid(),ver:1},err=[];[...FIELDS.map(x=>x[0])].forEach(k=>{let v=mp[k]?r[mp[k]]:'';if(['mfgDate','expDate','startDate'].includes(k)){const d=toDate(v);if(d===null)err.push(k+' تاريخ غير صالح');v=d||''}o[k]=String(v).trim()});
      o.points=mp.points?parsePoints(r[mp.points]):null;REQ.forEach(k=>{if(!o[k])err.push('ناقص: '+k)});if(!o.points)err.push('نقاط الجدول غير محددة — لن تُولَّد مواعيد حتى تُحدد يدوياً');
      const key=(o.product+'|'+o.batch).toLowerCase(),dup=seen.has(key);seen.add(key);out.push({o,err,dup,i:i+2})});
    const okN=out.filter(x=>!x.dup&&!x.err.some(e=>!e.startsWith('نقاط'))).length;
    m.querySelector('#pvo').innerHTML=`<p><b>${okN}</b> قابل للاستيراد · ${out.filter(x=>x.dup).length} مكرر · ${out.filter(x=>x.err.some(e=>!e.startsWith('نقاط'))).length} به أخطاء</p>${table(['Row','Product','Batch','Start','Points','ملاحظات'],out.map(x=>[x.i,esc(x.o.product),esc(x.o.batch),x.o.startDate,x.o.points?x.o.points.join(','):'—',(x.dup?'<span class="bad">مكرر — يُتخطى</span> ':'')+x.err.map(e=>'<span class="bad">'+e+'</span>').join('، ')]))}<div class="row"><button class="p" id="go">استيراد ${okN} سجل</button></div>`;
    m.querySelector('#go').onclick=async()=>{let n=0;for(const x of out){if(x.dup||x.err.some(e=>!e.startsWith('نقاط')))continue;if(!x.o.points)delete x.o.points;x.o.locked=false;const a=mkAudit('import','study',x.o.id,null,x.o);x.o.lastAudit=a.id;try{await commit([['audit',a.id,a],['studies',x.o.id,x.o]]);n++}catch(e){console.error(e)}}m.remove();alert('تم استيراد '+n+' دراسة. لم يتم حذف أو استبدال أي بيانات.');draw()}}};
/* ---------- shell ---------- */
function loginView(){
  $('#root').innerHTML=`<div id="login" class="card"><h2>Stability Management System</h2><h3 style="margin:0 0 4px">${esc(CO.name||'')}</h3><p class="muted">${FB?esc(window.FIREBASE_CONFIG.projectId):'وضع Local — غير متصل بقاعدة بيانات'}</p><div id="nm" hidden><label>الاسم</label><input id="ln"></div><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><p class="bad" id="le2"></p><div class="row"><button class="p" id="bl">دخول</button><button id="bs">حساب جديد</button></div><p class="muted">الحسابات الجديدة بتحتاج تفعيل من الـ Admin قبل ما تقدر تدخل على البيانات.</p></div>`;
  const run=async f=>{try{await f();await postLogin()}catch(e){$('#le2').textContent=e.message}};
  $('#bl').onclick=()=>run(()=>login($('#le').value.trim(),$('#lp').value));
  $('#bs').onclick=()=>{if($('#nm').hidden){$('#nm').hidden=false;return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,}$/.test($('#lp').value))return $('#le2').textContent='كلمة المرور: 12 حرف على الأقل، حروف كبيرة وصغيرة ورقم ورمز';run(()=>signup($('#ln').value.trim(),$('#le').value.trim(),$('#lp').value))};
}
async function postLogin(){draw();notifyCheck()}
function draw(){
  SMAP={};D.samples.forEach(x=>SMAP[x.id]=x);document.title=(ME&&coName()?coName()+' — ':'')+'Stability Management System';document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  if(!ME)return loginView();
  if(ME.role==='Pending')return $('#root').innerHTML=`<div id="login" class="card"><h2>${esc(ME.name)}</h2><p>حسابك اتسجل وبانتظار تفعيل المسؤول (Admin). مفيش صلاحية على أي بيانات لحد ما يفعّله.</p><div class="row"><button class="p" onclick="chkActive()">تحديث</button><button onclick="logout()">خروج</button></div></div>`;
  $('#root').innerHTML=`<div id="app"><nav><h1>${company().logo?`<img src="${company().logo}" style="max-height:30px;display:block;margin-bottom:6px">`:''}${esc(coName())}<br><small>Stability Mgmt · ${esc(ME.name)} · ${ME.role}</small></h1>${nav.map(n=>`<a class="${n===VIEW?'on':''}" onclick="VIEW='${n}';draw()">${t(n)}</a>`).join('')}<a onclick="logout()">${t('logout')}</a><small style="display:block;padding:10px 16px;opacity:.55;font-size:11px">${FB?esc(window.FIREBASE_CONFIG.projectId):'Local'}</small></nav><main>${VIEW==='studies'?`<div class="noprint" style="text-align:end">${IMPORT_BTN()}</div>`:''}${V[VIEW]()}</main></div>`;
  const q=document.querySelector('main input[placeholder]');if(q&&FILTER){q.focus();q.setSelectionRange(FILTER.length,FILTER.length)}
}
(async()=>{
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{await initBackend()}catch(e){document.body.innerHTML='<p style="padding:20px">'+esc(e.message)+'</p>';return}
  listen();
  if(FB){FB.auth.onAuthStateChanged(async u=>{if(!u){ME=null;draw();return}const d=await FB.db.collection('users').doc(u.uid).get();if(d.exists){ME=d.data();if(ME.disabled){await FB.auth.signOut();ME=null;draw();return}draw();notifyCheck()}})}
  else{const id=sessionStorage.getItem('sms_me');ME=D.users.find(u=>u.id===id)||null;draw();if(ME)notifyCheck()}
  setInterval(()=>{if(ME){draw();notifyCheck()}},3600e3);
  let idle;const bump=()=>{clearTimeout(idle);if(ME)idle=setTimeout(()=>{if(ME){logout();alert('تم تسجيل الخروج لعدم النشاط')}},15*60e3)};['click','keydown','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));bump();
})();
</script></body></html>
